{% extends "base.html" %}
{% block title %}Доступ заборонено{% endblock %}
{% block content %}
<style>
.denied-wrap { text-align: center; max-width: 440px; }
.denied-icon { font-size: 3.5rem; display: block; margin-bottom: 1.25rem; animation: shake 0.5s ease both; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-8px); }
  40%,80% { transform: translateX(8px); }
}
.denied-title { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #ef9a9a; border: none; padding: 0; margin-bottom: 0.5rem; }
.denied-sub { font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--danger); margin-bottom: 1rem; }
.denied-desc { color: rgba(245,240,232,0.6); font-size: 0.92rem; line-height: 1.75; margin-bottom: 2rem; }
.denied-divider { width: 50px; height: 1px; background: rgba(139,32,32,0.4); margin: 1rem auto; }
</style>
<div class="denied-wrap">
    <span class="denied-icon">🚫</span>
    <h2 class="denied-title">Доступ заборонено</h2>
    <p class="denied-sub">Тільки для магістрів ордену</p>
    <div class="denied-divider"></div>
    <p class="denied-desc">
        Ця зала відкрита лише для Адміністраторів Цитаделі. 
        Ваші повноваження не дозволяють переглядати цей розділ.
    </p>
    <a href="/" class="btn btn-ghost" style="width:auto; padding:10px 28px;">🏛 На головну</a>
</div>
{% endblock %}
