{% extends "base.html" %}
{% block title %}Помилка — Цитадель{% endblock %}
{% block content %}
<style>
    .error-card { text-align: center; }
    .error-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.6; }
    .error-top { margin-top: 1.5rem; }
</style>
<div class="card error-card">

</div>
{% endblock %}
